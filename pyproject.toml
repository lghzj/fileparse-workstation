[project]
name = "fileparse-workstation"
version = "0.1.0"
description = "NetStar file parse workstation clients"
requires-python = ">=3.11"
dependencies = [
  "watchdog>=6.0.0",
  "websockets>=15.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]
gui = [
  "PySide6>=6.8.0",
  "pyinstaller>=6.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
include = ["workstation*"]
